<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - Placement Portal</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="brand">🎓 Placement Portal — Admin</div>
    <div class="nav-right">
      <button id="logoutBtn" class="btn-outline">Logout</button>
    </div>
  </nav>

  <div class="container">
    <div class="tabs-row">
      <button class="tab-btn active" data-tab="postingsTab">Job Postings</button>
      <button class="tab-btn" data-tab="applicantsTab">Applications</button>
      <button class="tab-btn" data-tab="studentsTab">Students</button>
    </div>

    <!-- POSTINGS -->
    <div id="postingsTab" class="tab-content active card">
      <h2>Add New Posting</h2>
      <form id="jobForm">
        <input type="text" id="jTitle" placeholder="Title" required>
        <input type="text" id="jCompany" placeholder="Company" required>
        <select id="jType">
          <option value="Internship">Internship</option>
          <option value="Job">Job</option>
        </select>
        <input type="text" id="jLocation" placeholder="Location" required>
        <textarea id="jDesc" placeholder="Description" rows="3" required></textarea>
        <button type="submit" class="btn-primary">Add Posting</button>
      </form>

      <h2 style="margin-top:2rem">Current Postings</h2>
      <div id="jobsAdminList"></div>
    </div>

    <!-- APPLICATIONS -->
    <div id="applicantsTab" class="tab-content card">
      <h2>All Applications</h2>
      <div id="applicationsList"></div>
    </div>

    <!-- STUDENTS -->
    <div id="studentsTab" class="tab-content card">
      <h2>Registered Students</h2>
      <div id="studentsList"></div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    requireAdminSession();

    document.querySelectorAll('.tabs-row .tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tabs-row .tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.tab).classList.add('active');
        if(btn.dataset.tab === 'applicantsTab') renderApplications();
        if(btn.dataset.tab === 'studentsTab') renderStudents();
      });
    });

    logoutBtn.addEventListener('click', () => {
      clearAdminSession();
      window.location.href = 'index.html';
    });

    function renderJobsAdmin(){
      const jobs = getJobs();
      jobsAdminList.innerHTML = jobs.length ? jobs.map(j => `
        <div class="job-card">
          <span class="badge">${j.type}</span>
          <h3>${j.title}</h3>
          <p class="company">${j.company} &middot; ${j.location}</p>
          <p class="desc">${j.description}</p>
          <button class="btn-danger" data-id="${j.id}">Delete</button>
        </div>`).join('') : '<p class="hint">No postings yet.</p>';

      document.querySelectorAll('#jobsAdminList .btn-danger').forEach(btn => {
        btn.addEventListener('click', () => {
          if(confirm('Delete this posting?')){
            deleteJob(btn.dataset.id);
            renderJobsAdmin();
          }
        });
      });
    }

    jobForm.addEventListener('submit', function(e){
      e.preventDefault();
      addJob({
        title: jTitle.value, company: jCompany.value, type: jType.value,
        location: jLocation.value, description: jDesc.value
      });
      this.reset();
      renderJobsAdmin();
    });

    function renderApplications(){
      const apps = getApplications();
      const jobs = getJobs();
      const students = getStudents();
      applicationsList.innerHTML = apps.length ? apps.map(a => {
        const job = jobs.find(j => j.id === a.jobId) || {title:'Deleted', company:''};
        const student = students.find(s => s.id === a.studentId) || {name:'Unknown', email:''};
        return `<div class="status-row">
          <div>
            <strong>${student.name}</strong> applied for <strong>${job.title}</strong>
            <p class="hint">${student.email} &middot; ${job.company} &middot; ${a.appliedDate}</p>
          </div>
          <div class="app-actions">
            <select data-id="${a.id}" class="statusSelect">
              <option ${a.status==='Pending'?'selected':''}>Pending</option>
              <option ${a.status==='Accepted'?'selected':''}>Accepted</option>
              <option ${a.status==='Rejected'?'selected':''}>Rejected</option>
            </select>
          </div>
        </div>`;
      }).join('') : '<p class="hint">No applications yet.</p>';

      document.querySelectorAll('.statusSelect').forEach(sel => {
        sel.addEventListener('change', () => {
          updateApplicationStatus(sel.dataset.id, sel.value);
        });
      });
    }

    function renderStudents(){
      const students = getStudents();
      studentsList.innerHTML = students.length ? students.map(s => `
        <div class="status-row">
          <div>
            <strong>${s.name}</strong>
            <p class="hint">${s.email} &middot; ${s.phone} &middot; ${s.course}</p>
          </div>
          <span class="hint">${s.resumeName ? 'Resume uploaded' : 'No resume'}</span>
        </div>`).join('') : '<p class="hint">No students registered yet.</p>';
    }

    renderJobsAdmin();
  </script>
</body>
</html>
